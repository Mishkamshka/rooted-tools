<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hubot Highlight</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="modal"><div class="modal-box" id="modalBox">
  <span class="lbl" id="modalTitle"></span>
  <p id="modalMsg"></p>
  <div class="stack" id="modalActions"></div>
</div></div>

<header>
  <div class="hdr-left">
    <div class="menu-anchor" id="loadAnchor">
      <button type="button" id="loadBtn">Load</button>
      <div class="ctx-menu closed" id="loadMenu"></div>
    </div>
    <div class="menu-anchor" id="saveAnchor" style="display:flex;align-items:center;gap:6px">
      <input type="text" id="layoutName" placeholder="Untitled" style="width:140px">
      <button type="button" id="saveBtn">Save</button>
      <div class="ctx-menu closed" id="saveMenu"></div>
    </div>
    <div class="menu-anchor" id="exportAnchor">
      <button type="button" id="exportMenuBtn">Export</button>
      <div class="ctx-menu closed" id="exportMenu">
        <button type="button" id="exportPng1Btn">1&times; PNG</button>
        <button type="button" id="exportPng2Btn">2&times; PNG</button>
        <button type="button" id="exportSvgBtn">SVG</button>
      </div>
    </div>
    <span class="lbl" id="status"></span>
  </div>
  <div class="hdr-tools">
    <div class="zoomctl">
      <button id="zoomOut">&minus;</button>
      <span id="zoomLbl">100%</span>
      <button id="zoomIn">+</button>
    </div>
    <button id="undoBtn" title="Undo">&#8634; Undo</button>
    <button id="redoBtn" title="Redo">&#8635; Redo</button>
  </div>
</header>

<div class="wrap">
  <div class="canvas">
    <div class="stage"><svg id="board" viewBox="0 0 1920 1080" width="1920" height="1080" xmlns="http://www.w3.org/2000/svg"></svg></div>
  </div>
</div>

<footer class="bottom-bar">
  <div>
    <div class="menu-anchor up" id="addSubtitleAnchor">
      <button type="button" id="addSubtitleBtn">Add subtitle</button>
      <div class="ctx-menu closed" id="addSubtitleMenu" style="min-width:220px">
        <div style="padding:4px 4px 6px" id="subColourList"></div>
        <span class="lbl" style="padding:0 6px">Subtitle text</span>
        <div style="padding:4px 6px 6px">
          <textarea id="subtitle" spellcheck="true" placeholder="Optional line above the title"></textarea>
        </div>
      </div>
    </div>
    <button type="button" id="addDateBtn">Add date</button>
    <div class="menu-anchor up" id="textAppearanceAnchor">
      <button type="button" id="textAppearanceBtn">Text appearance</button>
      <div class="ctx-menu closed" id="textAppearanceMenu" style="min-width:280px">
        <span class="lbl" style="padding:4px 6px 0">Font size</span>
        <div class="btn-row" style="padding:4px 6px 8px">
          <button data-size="150">H1</button>
          <button data-size="100">H2</button>
          <button data-size="50">H3</button>
        </div>
        <span class="lbl" style="padding:0 6px">Heading text</span>
        <div style="padding:4px 6px 6px">
          <textarea id="text" spellcheck="true">Black Maternal Futures
Project Wrap-up</textarea>
        </div>
        <hr>
        <button type="button" data-a="clear">Clear overrides</button>
        <button type="button" data-a="presets">Colour presets <span class="ctx-caret">&#9656;</span></button>
        <hr>
        <button type="button" data-a="selectAll">Highlight all</button>
        <button type="button" data-a="deselectAll">Un-highlight all</button>
        <hr>
        <button type="button" data-a="swap">Swap colours</button>
      </div>
    </div>
  </div>
  <div class="menu-anchor up right" id="settingsAnchor">
    <button type="button" id="settingsBtn">Settings</button>
    <div class="ctx-menu closed" id="settingsMenu" style="min-width:280px">
      <span class="lbl" style="padding:4px 6px 0">Date</span>
      <div class="field">
        <label>Month / year</label>
        <div class="row">
          <select id="dateMonth" style="flex:1"></select>
          <select id="dateYear" style="flex:1"></select>
        </div>
      </div>
      <div class="field">
        <label>Date colour</label>
        <div class="combo" id="datePresetCombo">
          <button type="button" class="combo-trigger" id="datePresetTrigger">
            <span class="swatch-dot"></span>
            <span class="combo-label">Custom</span>
            <span class="combo-caret">&#9662;</span>
          </button>
          <div class="combo-menu" id="datePresetMenu" hidden></div>
        </div>
      </div>
      <div style="padding:0 6px 6px"><button id="dateSwapBtn">&#8646; Swap date colours</button></div>
    </div>
  </div>
</footer>

<input type="file" id="importJsonFile" accept="application/json" style="display:none">

<script type="module" src="harfbuzz-bundle.js"></script>
<script src="app.js"></script>
</body>
</html>
