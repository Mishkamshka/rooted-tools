<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hubot Highlight</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="modal"><div class="modal-box" id="modalBox">
  <span class="lbl" id="modalTitle"></span>
  <p id="modalMsg"></p>
  <div class="stack" id="modalActions"></div>
</div></div>

<header>
  <div class="hdr-left">
    <div class="menu-anchor" id="loadAnchor">
      <button type="button" id="loadBtn">Load</button>
      <div class="ctx-menu menu-bk closed" id="loadMenu"></div>
    </div>
    <div class="menu-anchor" id="saveAnchor">
      <input type="text" id="layoutName" placeholder="Untitled">
      <button type="button" id="saveBtn">Save</button>
      <div class="ctx-menu menu-bk closed" id="saveMenu"></div>
    </div>
    <div class="menu-anchor" id="exportAnchor">
      <button type="button" id="exportMenuBtn">Export</button>
      <div class="ctx-menu closed menu-bk" id="exportMenu">
        <button type="button" id="exportPng1Btn">1&times; PNG</button>
        <button type="button" id="exportPng2Btn">2&times; PNG</button>
        <button type="button" id="exportSvgBtn">SVG</button>
      </div>
    </div>
    <span class="lbl" id="status"></span>
  </div>
  <div class="hdr-center">
        <div class="menu-anchor" id="textAppearanceAnchor">
      <button type="button" id="textAppearanceBtn">Title</button>
      <div class="ctx-menu closed" id="textAppearanceMenu">
        <div class="font-size-section menu-bk">
          <span class="lbl">Font size</span>
          <div class="btn-row menu-field-lg">
            <button data-size="150">H1</button>
            <button data-size="100">H2</button>
            <button data-size="50">H3</button>
          </div>
      </div>
        <div class="heading-text-section menu-bk">
        <span class="lbl menu-sublabel">Title text</span>
        <div class="menu-field">
          <textarea id="text" spellcheck="true" placeholder="Edit text here"></textarea>
        </div>
        </div>
        <div class="settings-text-section menu-bk">
        <button type="button" data-a="clear">Clear overrides</button>
        <button type="button" data-a="presets">Colour presets <span class="ctx-caret">&#9656;</span></button>
        <button type="button" id="taToggleAllBtn" data-a="toggleAll">Un-highlight all</button>
        <button type="button" data-a="swap">&#8646; Swap colours</button>
      </div>
      </div>
    </div>
    <div class="menu-anchor" id="addSubtitleAnchor">
      <button type="button" id="addSubtitleBtn">Subtitle</button>
      <div class="ctx-menu closed" id="addSubtitleMenu">
        <div class="menu-field-lg menu-bk"><button type="button" id="subtitleToggleBtn">Show subtitle</button></div>
        <div class="addsubtext menu-bk">
          <span class="lbl menu-sublabel">Subtitle text</span>
        <div class="menu-field">
          <textarea id="subtitle" spellcheck="true" placeholder="Optional line above the title"></textarea>
        </div>
        </div>
        <div class="menu-list" id="subColourList"></div>
      </div>
    </div>
    <div class="menu-anchor" id="addDateAnchor">
      <button type="button" id="addDateBtn">Date</button>
      <div class="ctx-menu closed" id="addDateMenu">
        <div class="menu-bk"><button type="button" id="dateToggleBtn">Show date</button></div>
        <div class="adddate menu-bk">
          <span class="lbl">Month &amp; year</span>
          <div class="field">
            <div class="row">
              <select id="dateMonth"></select>
              <select id="dateYear"></select>
            </div>
          </div>
        </div>
        <div class="adddate-btns menu-bk">
          <button type="button" data-a="presets">Colour presets <span class="ctx-caret">&#9656;</span></button>
          <button type="button" data-a="swap">&#8646; Swap colours</button>
          <button type="button" data-a="matchTitle">Match title colours</button>
        </div>
      </div>
    </div>
  </div>
  <div class="hdr-tools">
    <div class="zoomctl">
      <button id="zoomOut">&minus;</button>
      <span id="zoomLbl">100%</span>
      <button id="zoomIn">+</button>
    </div>
    <button id="undoBtn" title="Undo">&#8634; Undo</button>
    <button id="redoBtn" title="Redo">&#8635; Redo</button>
  </div>
</header>

<div class="wrap">
  <div class="canvas">
    <div class="stage"><svg id="board" viewBox="0 0 1920 1080" width="1920" height="1080" xmlns="http://www.w3.org/2000/svg"></svg></div>
  </div>
</div>

<input type="file" id="importJsonFile" accept="application/json">

<script type="module" src="harfbuzz-bundle.js"></script>
<script src="app.js"></script>
</body>
</html>
