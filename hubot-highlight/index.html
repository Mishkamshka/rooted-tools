<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hubot Highlight</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="modal"><div class="modal-box" id="modalBox">
  <span class="lbl" id="modalTitle"></span>
  <p id="modalMsg"></p>
  <div class="stack" id="modalActions"></div>
</div></div>

<header>
  <div class="hdr-left">
    <div class="menu-anchor" id="loadAnchor">
      <button type="button" id="loadBtn">Load</button>
      <div class="ctx-menu closed" id="loadMenu"></div>
    </div>
    <div class="menu-anchor" id="saveAnchor">
      <input type="text" id="layoutName" placeholder="Untitled">
      <button type="button" id="saveBtn">Save</button>
      <div class="ctx-menu closed" id="saveMenu"></div>
    </div>
    <div class="menu-anchor" id="exportAnchor">
      <button type="button" id="exportMenuBtn">Export</button>
      <div class="ctx-menu closed" id="exportMenu">
        <button type="button" id="exportPng1Btn">1&times; PNG</button>
        <button type="button" id="exportPng2Btn">2&times; PNG</button>
        <button type="button" id="exportSvgBtn">SVG</button>
      </div>
    </div>
    <span class="lbl" id="status"></span>
  </div>
  <div class="hdr-tools">
    <div class="zoomctl">
      <button id="zoomOut">&minus;</button>
      <span id="zoomLbl">100%</span>
      <button id="zoomIn">+</button>
    </div>
    <button id="undoBtn" title="Undo">&#8634; Undo</button>
    <button id="redoBtn" title="Redo">&#8635; Redo</button>
  </div>
</header>

<div class="wrap">
  <div class="canvas">
    <div class="stage"><svg id="board" viewBox="0 0 1920 1080" width="1920" height="1080" xmlns="http://www.w3.org/2000/svg"></svg></div>
  </div>
</div>

<footer class="bottom-bar">
  <div>
    <div class="menu-anchor up" id="addSubtitleAnchor">
      <button type="button" id="addSubtitleBtn">Show subtitle</button>
      <div class="ctx-menu closed" id="addSubtitleMenu">
        <div class="menu-list" id="subColourList"></div>
        <div class="addsubtext">
          <span class="lbl menu-sublabel">Subtitle text</span>
        <div class="menu-field">
          <textarea id="subtitle" spellcheck="true" placeholder="Optional line above the title"></textarea>
        </div>
        </div>
      </div>
    </div>
    <div class="menu-anchor up" id="addDateAnchor">
      <button type="button" id="addDateBtn">Show date</button>
      <div class="ctx-menu closed" id="addDateMenu">
        <div class="adddate">
          <span class="lbl">Month &amp; year</span>
          <div class="field">
            <div class="row">
              <select id="dateMonth"></select>
              <select id="dateYear"></select>
            </div>
          </div>
        </div>
        <div class="adddate-btns">
          <button type="button" data-a="matchTitle">Match title colours</button>
          <button type="button" data-a="presets">Colour presets <span class="ctx-caret">&#9656;</span></button>
          <hr>
          <button type="button" data-a="swap">Swap colours</button>
        </div>
      </div>
    </div>
    <div class="menu-anchor up" id="textAppearanceAnchor">
      <button type="button" id="textAppearanceBtn">Text appearance</button>
      <div class="ctx-menu closed" id="textAppearanceMenu">
        <span class="lbl">Font size</span>
        <div class="btn-row menu-field-lg">
          <button data-size="150">H1</button>
          <button data-size="100">H2</button>
          <button data-size="50">H3</button>
        </div>
        <span class="lbl menu-sublabel">Heading text</span>
        <div class="menu-field">
          <textarea id="text" spellcheck="true">Black Maternal Futures
Project Wrap-up</textarea>
        </div>
        <hr>
        <button type="button" data-a="clear">Clear overrides</button>
        <button type="button" data-a="presets">Colour presets <span class="ctx-caret">&#9656;</span></button>
        <hr>
        <button type="button" id="taToggleAllBtn" data-a="toggleAll">Un-highlight all</button>
        <hr>
        <button type="button" data-a="swap">Swap colours</button>
      </div>
    </div>
  </div>
  <div class="menu-anchor up right" id="settingsAnchor">
    <button type="button" id="settingsBtn">Controls</button>
    <div class="ctx-menu closed" id="settingsMenu">
      <!-- Duplicates everything that used to live in the old always-visible
           sidebar panels, one section per panel, in their original order —
           the header/footer give quick single-purpose access to most of
           this already, but Settings is meant to be the complete mirror. -->
      <span class="lbl">Subtitle</span>
      <div class="menu-list" id="stSubColourList"></div>
      <div class="menu-field-lg">
        <textarea id="stSubtitle" spellcheck="true" placeholder="Optional line above the title"></textarea>
      </div>
      <hr>
      <span class="lbl">Text</span>
      <div class="menu-field">
        <textarea id="stText" spellcheck="true"></textarea>
      </div>
      <div class="menu-row"><button id="stToggleHighlightBtn">Un-highlight all</button></div>
      <hr>
      <span class="lbl">Date</span>
      <div class="field">
        <label>Month / year</label>
        <div class="row">
          <select id="stDateMonth"></select>
          <select id="stDateYear"></select>
        </div>
      </div>
      <button type="button" data-a="matchTitle">Match title colours</button>
      <button type="button" data-a="presets">Colour presets <span class="ctx-caret">&#9656;</span></button>
      <hr>
      <button type="button" data-a="swap">Swap colours</button>
      <hr>
      <span class="lbl">Type</span>
      <div class="btn-row menu-field-lg">
        <button data-size="150">H1</button>
        <button data-size="100">H2</button>
        <button data-size="50">H3</button>
      </div>
      <hr>
      <span class="lbl">Colour presets</span>
      <div class="field">
        <div class="combo" id="stTitlePresetCombo">
          <button type="button" class="combo-trigger" id="stTitlePresetTrigger">
            <span class="swatch-dot"></span>
            <span class="combo-label">—</span>
            <span class="combo-caret">&#9662;</span>
          </button>
          <div class="combo-menu" id="stTitlePresetMenu" hidden></div>
        </div>
      </div>
      <div class="menu-row-sm"><button id="stColorSwapBtn">&#8646; Swap colours</button></div>
      <div class="menu-row"><button id="stClearOverridesBtn">Clear all overrides</button></div>
      <hr>
      <span class="lbl">Save &amp; load</span>
      <div class="field">
        <label>Name</label>
        <input type="text" id="stLayoutName" placeholder="Untitled">
      </div>
      <div class="menu-row"><button id="stSaveBtn">Save</button></div>
      <div id="stLoadList" class="menu-row-xs"></div>
      <div class="btn-row menu-row">
        <button id="stExportJsonBtn">Export styles</button>
        <button id="stImportJsonBtn">Import styles</button>
      </div>
      <hr>
      <span class="lbl">Export resolution</span>
      <div class="btn-row menu-field-lg">
        <button data-scale="1">1&times;</button>
        <button data-scale="2">2&times;</button>
      </div>
      <div class="btn-row menu-row">
        <button id="stExportBtn">Export PNG</button>
        <button id="stExportSvgBtn">Export SVG</button>
      </div>
    </div>
  </div>
</footer>

<input type="file" id="importJsonFile" accept="application/json">

<script type="module" src="harfbuzz-bundle.js"></script>
<script src="app.js"></script>
</body>
</html>
